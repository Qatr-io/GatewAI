name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - "website/**"

  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy Astro site
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Deploy to gh-pages (preserve Helm chart files)
        run: |
          # Preserve Helm artefacts from current gh-pages
          git fetch origin gh-pages
          mkdir -p /tmp/helm-preserve
          git show origin/gh-pages:index.yaml > /tmp/helm-preserve/index.yaml 2>/dev/null || true
          for tgz in $(git ls-tree --name-only origin/gh-pages | grep '\.tgz$'); do
            git show "origin/gh-pages:${tgz}" > "/tmp/helm-preserve/${tgz}" 2>/dev/null || true
          done

          # Prepare deploy dir from Astro build output
          cp -r website/dist /tmp/deploy
          touch /tmp/deploy/.nojekyll
          [ -s /tmp/helm-preserve/index.yaml ] && cp /tmp/helm-preserve/index.yaml /tmp/deploy/
          for f in /tmp/helm-preserve/*.tgz; do [ -f "$f" ] && cp "$f" /tmp/deploy/; done

          # Fresh git repo → force-push to gh-pages (avoids workspace contamination)
          cd /tmp/deploy
          git init
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: deploy Astro site from ${GITHUB_SHA::8}"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
