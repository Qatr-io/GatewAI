name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - "website/**"

  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy Astro site
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Deploy to gh-pages (preserve Helm chart files)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the built site
          cp -r website/dist /tmp/astro-site

          # Checkout gh-pages and preserve Helm artefacts
          git fetch origin gh-pages
          git checkout gh-pages

          # Save Helm index and chart packages
          mkdir -p /tmp/helm-preserve
          [ -f index.yaml ] && cp index.yaml /tmp/helm-preserve/
          for f in *.tgz; do [ -f "$f" ] && cp "$f" /tmp/helm-preserve/; done

          # Wipe and replace with built site
          git rm -rf . --quiet || true

          cp -r /tmp/astro-site/. .

          # Restore Helm artefacts
          [ -f /tmp/helm-preserve/index.yaml ] && cp /tmp/helm-preserve/index.yaml .
          for f in /tmp/helm-preserve/*.tgz; do [ -f "$f" ] && cp "$f" .; done

          git add .
          git diff --cached --quiet || git commit -m "docs: deploy Astro site from ${GITHUB_SHA::8}"
          git push origin gh-pages
