apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-transcription-config
  namespace: <namespace>
data:
  config.yaml: |
    redis:
      addr: "<redis-addr>:6379"   # e.g. redis-haproxy.infra-redis.svc.cluster.local:6379

    s3:
      endpoint: "https://s3.fr-par.scw.cloud"
      region: "fr-par"
      bucket: "<bucket>"
      access_key: "${S3_ACCESS_KEY}"
      secret_key: "${S3_SECRET_KEY}"

    services:
      - type: transcription
        model: whisper-large-v3
        inference_url: "http://127.0.0.1:9000/v1/audio/transcriptions"
