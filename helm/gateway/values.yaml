replicaCount: 1

image:
  repository: ghcr.io/qatr-io/gatewai/gateway
  tag: "v0.18.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: api.gatewai.example.com
  tls: []
  #  - secretName: gatewai-gateway-tls
  #    hosts:
  #      - api.gatewai.example.com

# ── Server ────────────────────────────────────────────────────────────────────
server:
  # HTTP header injected by the API gateway to identify the consumer.
  # Required for per-consumer rate limiting and job ownership enforcement.
  # Example: "X-Consumer-Username" (APISIX), "X-Forwarded-User" (nginx)
  consumerHeader: ""
  # HTTP header carrying the consumer type (e.g. "premium", "free").
  # Used for per-type rate limiting (matched against rate_limits[type][user_type]).
  # "*" is the fallback when absent.
  userTypeHeader: ""
  # HTTP header set by the API gateway on high-priority requests.
  # When present, jobs are pushed to the head of the Redis queue.
  priorityHeader: ""

# ── Authentication (optional) ─────────────────────────────────────────────────
# Empty ⇒ no gateway-side auth: identity is trusted from the upstream headers
# above (gateway behind an upstream reverse proxy). Pick ONE mode per deployment.
#   auth:
#     mode: oauth2                 # oauth2 | proxy
#     oauth2:
#       issuer: "https://idp.example.com/realm"
#       jwksUrl: ""                # optional explicit override
#       audiences: ["gatewai"]
#       validation: auto           # auto | jwt | introspection
#       introspection:             # for opaque tokens (RFC 7662) + live revocation
#         clientId: "${OAUTH_CLIENT_ID}"
#         clientSecret: "${OAUTH_CLIENT_SECRET}"
#         cacheTtl: 60s
#       claims:
#         consumer: "preferred_username"
#         scopes: "scope"
#         groups: "groups"
#         roles: "roles"
#     proxy:
#       consumerHeader: "X-Consumer-Username"
#       userTypeHeader: "X-Consumer-Type"
#       groupsHeader: "X-Consumer-Groups"
#       rolesHeader: "X-Consumer-Roles"
auth: {}

# ── Access control (optional) ─────────────────────────────────────────────────
# Default-deny model/service allowlist. Requires auth (above). Mirrors the
# config.yaml `policies` structure verbatim (rendered as-is into the ConfigMap).
#   policies:
#     default: deny
#     rules:
#       - match: { groups: ["research-lab"] }
#         allow_models: ["gpt-oss-120b", "chat-*"]
#         allow_service_types: ["llm"]
policies: {}

# ── Rate limiting ─────────────────────────────────────────────────────────────
# Request-count rate limits per service type and user type.
# "*" acts as fallback when the user_type_header is absent or unmatched.
# rate: 0 = unlimited sentinel (no Redis check performed).
# Requires server.consumerHeader and server.userTypeHeader to be set.
#
# Available limit fields per entry:
#   rate / period              — max requests per window
#   tokenRate / tokenPeriod    — max cumulative tokens per window (LLM only)
#   maxConcurrent              — max async jobs in pending+processing simultaneously
#   processingTime / processingPeriod — max cumulative inference seconds per window
#
# Example:
# rateLimits:
#   audio:
#     premium:
#       rate: 100
#       period: "1m"
#       maxConcurrent: 10
#       processingTime: 7200
#       processingPeriod: "1h"
#     "*":
#       rate: 10
#       period: "1m"
#       maxConcurrent: 1
#       processingTime: 120
#       processingPeriod: "1h"
#   llm:
#     "*":
#       rate: 20
#       period: "1m"
rateLimits: {}

# ── Configuration ────────────────────────────────────────────────────────────
config:
  # Option B : référencer une ConfigMap existante contenant config.yaml.
  # Si renseigné, le chart ne crée pas de ConfigMap et utilise celle-ci.
  # La ConfigMap doit contenir la clé "config.yaml".
  existingConfigMap: ""

# ── S3 / Scaleway Object Storage ─────────────────────────────────────────────
s3:
  endpoint: "https://s3.fr-par.scw.cloud"
  region: "fr-par"
  bucket: "test-gatewai-jobs"
  # Option A : fournir les credentials directement (créé un Secret dans le cluster)
  accessKey: ""
  secretKey: ""
  # Option B : référencer un Secret existant (ex: géré par External Secrets)
  #   Le Secret doit contenir les clés S3_ACCESS_KEY et S3_SECRET_KEY.
  existingSecret: ""
  # CA bundle pour la vérification TLS de l'endpoint S3 (CA privé ou auto-signé).
  # Référencer un Secret existant contenant le certificat PEM.
  # Le volume est monté sous /etc/ssl/s3-ca/ et S3_CA_BUNDLE est injecté automatiquement.
  # Laisser vide pour utiliser le pool système (défaut).
  existingCABundle: ""      # nom du Secret
  existingCABundleKey: "ca.crt"  # clé dans le Secret
  usePathStyle: true        # path-style URLs — requis pour la plupart des providers S3-compatibles
  sslInsecure: false        # désactive la vérification TLS (développement uniquement)

# ── Chiffrement at-rest (S3) ──────────────────────────────────────────────────
# Clé AES-256-GCM partagée entre le gateway et tous les relay sidecars.
# Générer : openssl rand -hex 32
# Vide = chiffrement désactivé.
encryption:
  key: ""
  # Option B : référencer un Secret existant (ex: géré par External Secrets)
  #   Le Secret doit contenir la clé ENCRYPTION_KEY.
  existingSecret: ""

# ── Services d'inférence enregistrés ─────────────────────────────────────────
# Chaque service peut opérer en mode async (Redis queue) et/ou sync (proxy OpenAI).
#
# Champs sync (optionnels) :
#   model        — valeur du champ "model" dans le payload OpenAI, utilisée pour
#                  router les requêtes POST /v1/* vers le bon backend
#   operations   — map opération → liste de chemins URL
#                  ex: transcription: ["/v1/audio/transcriptions"]
#                  Tous les chemins sont indexés pour le routage sync ;
#                  le premier est utilisé comme InferenceURL en mode async.
#   inferenceURL — URL de base du relay Knative ; le chemin de la requête
#                  d'origine y est appendé automatiquement
#
# Champs async (Redis queue) :
#   acceptedExts / maxFileSizeMB
#   En async, spécifier l'opération via le champ de formulaire "operation"
#   si le modèle en propose plusieurs.
services:
  - type: audio
    # Sync / OpenAI-compatible
    model: "whisper-large-v3"
    default: true
    operations:
      transcription:
        - "/v1/audio/transcriptions"
      translation:
        - "/v1/audio/translations"
    inferenceURL: "http://gatewai-transcription-predictor.default.svc.cluster.local"
    acceptedExts: [".mp3", ".wav", ".m4a", ".ogg", ".flac"]
    maxFileSizeMB: 500

  - type: ocr
    # Sync / OpenAI-compatible
    model: "llava-v1.6-mistral-7b"
    operations:
      ocr:
        - "/v1/ocr"
        - "/v1/vision/ocr"
    inferenceURL: "http://gatewai-ocr-predictor.default.svc.cluster.local"
    acceptedExts: [".pdf", ".jpg", ".jpeg", ".png", ".tiff", ".bmp"]
    maxFileSizeMB: 50

  # ── LLM proxy avec token rate limiting ───────────────────────────────────
  # provider: passthrough|openai|anthropic|ollama
  # tokenLimits : budget tokens par user type, indépendant du rate_limits service.
  # Requires server.consumerHeader + server.userTypeHeader.
  #
  # - type: llm
  #   model: "gpt-4o"
  #   provider: passthrough
  #   operations:
  #     chat:
  #       - "/v1/chat/completions"
  #   backends:
  #     - url: "http://my-llm-backend.svc"
  #       weight: 100
  #   tokenLimits:
  #     premium:
  #       tokenRate: 500000
  #       tokenPeriod: "24h"
  #     "*":
  #       tokenRate: 50000
  #       tokenPeriod: "24h"
  #   responseCacheTTL: 300
  #   guardrails:
  #     # action: block (422) | redact (mask in-place) | flag (log only)
  #     action: redact
  #     # Check groups (all opt-in): pii (universal), pii_fr, pii_us, pii_uk, pii_es, pii_it, secrets.
  #     checks: [pii, secrets]
  #     # Optional output stage — scan/redact the model RESPONSE (streaming degrades to flag).
  #     output:
  #       checks: [pii, secrets]
  #       action: redact

  # ── Multi-backend : blue/green, canary, fallback ─────────────────────────
  # Remplace inferenceURL par une liste backends. Mutuellement exclusif avec
  # inferenceURL (backends a la priorité si les deux sont renseignés).
  #
  # weight > 0 : éligible en sélection primaire (pondération relative).
  # weight = 0 : fallback-only (jamais sélectionné en primaire ; essayé
  #              uniquement si tous les backends weight>0 échouent).
  #
  # Blue/green  → weight: 100/0 ; promotion = swap des weights
  # Canary      → weight: 90/10
  # Fallback    → weight: 100 + weight: 0
  #
  # - type: llm
  #   model: "gpt-4o"
  #   operations:
  #     chat:
  #       - "/v1/chat/completions"
  #   backends:
  #     - url: "http://backend-v1.svc"
  #       weight: 90
  #       model: "llama-3.1-8b"            # optionnel : nom de modèle réel envoyé à ce backend (override backend_model)
  #       headers:                          # optionnel : headers spécifiques à ce backend (override inference_headers)
  #         Authorization: "Bearer ${STABLE_API_KEY}"
  #     - url: "http://backend-v2.svc"
  #       weight: 10
  #       model: "llama-3.2-8b"            # canary : version différente du modèle
  #       headers:
  #         Authorization: "Bearer ${CANARY_API_KEY}"
  #     - url: "http://backend-fallback.svc"
  #       weight: 0    # last resort

  # Exemple de service sync-direct uniquement (sans Kafka).
  # Les requêtes POST /v1/* sont proxifiées directement vers inferenceURL.
  # POST /jobs/{service_type} retourne 405.
  # - type: reranker
  #   model: "bge-reranker-v2-m3"
  #   operations:
  #     rerank:
  #       - "/rerank"
  #   inferenceURL: "http://gatewai-reranker-predictor.default.svc.cluster.local"
  #   # Pas de inputTopic / resultTopic → sync-direct uniquement
  #
  #   # Headers injectés sur chaque requête vers le backend (sync-direct uniquement).
  #   # Les valeurs supportent ${VAR} (expansion depuis les variables d'environnement).
  #   # Ces headers écrasent ceux éventuellement envoyés par le client.
  #   # inferenceHeaders:
  #   #   Authorization: "Bearer ${RERANKER_API_KEY}"
  #   #   X-Api-Key: "${BACKEND_KEY}"

# ── Redis ─────────────────────────────────────────────────────────────────────
# Valeurs passées au subchart dandydeveloper/redis-ha.
# HAProxy est activé pour exposer un endpoint stable (master actif) au gateway.
redis-ha:
  enabled: true
  haproxy:
    enabled: true    # expose {{ .Release.Name }}-redis-ha-haproxy:6379
    replicas: 2
  redis:
    masterGroupName: "mymaster"
  replicas: 3

# ── Lifecycle — job record and S3 result retention ───────────────────────────
lifecycle:
  # When true, S3 results and Redis records persist until their TTL expires.
  # When false (default), cleanup is immediate on first GET or webhook delivery.
  persistsResult: false
  jobTTL:
    # global: fallback TTL for all job statuses. Example: "24h", "72h"
    global: ""
    # Per-status overrides (take precedence over global):
    # completed: ""
    # pending:   ""
    # failed:    ""
  gc:
    # enabled: set to true to activate the unified GC
    enabled: false
    # interval: how often the GC runs. Default "15m".
    interval: "15m"
    # orphanMinAge: S3 objects younger than this are never treated as orphans. Default "5m".
    orphanMinAge: "5m"

metricsConfig:
  # Nombre de top consumers à exposer dans Prometheus (Redis sorted set, refresh 60s).
  # 0 = désactivé. Recommandé : 20–50.
  topConsumers: 0
  # Labels Prometheus directs par consumer. Uniquement pour < 50 consumers connus.
  # Pour des consumers dynamiques, utiliser topConsumers à la place.
  consumerLabels: false

# ── Monitoring (Prometheus Operator) ─────────────────────────────────────
metrics:
  serviceMonitor:
    enabled: false
    # Namespace où créer le ServiceMonitor (défaut : même namespace que la release).
    # À renseigner si le namespace du Prometheus Operator diffère.
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    # Labels supplémentaires à apposer sur le ServiceMonitor — utile pour que
    # le Prometheus Operator sélectionne ce monitor via son champ
    # spec.serviceMonitorSelector.matchLabels.
    # Exemple : release: kube-prometheus-stack
    additionalLabels: {}
    relabelings: []
    metricRelabelings: []

# ── Alerting (Prometheus Operator) ───────────────────────────────────────────
alerting:
  prometheusRule:
    enabled: false
    # Namespace où créer la PrometheusRule (défaut : même namespace que la release).
    namespace: ""
    # Labels supplémentaires — doit correspondre au ruleSelector du Prometheus Operator.
    # Exemple : release: kube-prometheus-stack
    additionalLabels: {}
    # URL de base des runbooks. Les URLs finales seront <runbookBaseURL>/<AlertName>.
    runbookBaseURL: "https://ia-generative.github.io/gatewai-ai/runbooks"
    # Seuils modifiables par alerte.
    thresholds:
      # Taux d'erreur gateway (0.05 = 5%)
      gatewayErrorRateWarning: 0.05
      gatewayErrorRateCritical: 0.20
      # Nombre de jobs sync en vol simultanés avant alerte
      syncJobsInFlight: 20
      # Taux d'échec relay (0.10 = 10%)
      relayJobFailureRateWarning: 0.10
      relayJobFailureRateCritical: 0.30
      # Durée d'inférence p95 en secondes avant alerte slow
      relayInferenceP95Seconds: 120
      # Taux de rejet rate limit (0.20 = 20% des requêtes rejetées sur un service)
      rateLimitRejectionRateWarning: 0.20
    # Règles supplémentaires ajoutées au groupe gatewai-relay.
    extraRules: []
    # Exemple :
    # extraRules:
    #   - alert: MyCustomAlert
    #     expr: gatewai_relay_deferred_total > 100
    #     for: 5m
    #     labels:
    #       severity: warning
    #     annotations:
    #       summary: "Too many deferred async jobs"

# ── Ressources / scheduling ───────────────────────────────────────────────────
resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ── Variables d'environnement supplémentaires ─────────────────────────────────
# Injectées telles quelles dans le container gateway, après les variables gérées
# par le chart. Accepte toute syntaxe Kubernetes (value, valueFrom, secretKeyRef…).
# Exemple pour un token GitHub stocké dans un Secret :
#
# extraEnvVars:
#   - name: GITHUB_TOKEN
#     valueFrom:
#       secretKeyRef:
#         name: github-token
#         key: token
extraEnvVars: []

# ── Config hot-reload sidecar ─────────────────────────────────────────────────
# Watches the ConfigMap volume and POSTs /-/reload when the config file changes.
configReloader:
  enabled: false
  image: "ghcr.io/jimmidyson/configmap-reload:v0.14.0"
  # Port exposed by the configmap-reload metrics/web server.
  listenPort: 9533

# ── OpenTelemetry ─────────────────────────────────────────────────────────────
# Configures OTLP export for traces, metrics, and logs.
# When the otlp sub-chart is enabled (below), the default endpoint points to
# the bundled collector's OTLP/HTTP receiver (aliased as "otlp").
opentelemetry:
  enabled: false
  # serviceName overrides the default "gatewai/gateway" resource attribute.
  # Set this to match your Loki service_name label for log-to-trace correlation.
  serviceName: ""
  exporter:
    endpoint: "http://{{ .Release.Name }}-otlp:4318"
    insecure: true
  traces:
    enabled: true
    sampleRatio: 1.0
  metrics:
    enabled: false
    interval: "60s"
  logs:
    enabled: false

# ── OpenTelemetry Collector — Option A: sub-chart (alias: otlp) ───────────────
# Deploys a standalone OTel Collector alongside the gateway.
# Helm repo: helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
# Service name with alias: <release>-otlp:4318
#
# Note: otlp.operator cannot live here — the sub-chart has a strict JSON schema
# (additionalProperties: false) that rejects unknown keys. See otlpOperator below.
otlp:
  enabled: false
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: "0.0.0.0:4318"
    exporters:
      # Replace with your backend — examples:
      # otlp/tempo:
      #   endpoint: "http://tempo:4317"
      # otlphttp/jaeger:
      #   endpoint: "http://jaeger-collector:4318"
      debug: {}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          exporters: [debug]
        logs:
          receivers: [otlp]
          exporters: [debug]

# ── OpenTelemetry Collector — Option B: Operator CRD ─────────────────────────
# Creates an OpenTelemetryCollector CR managed by the OTel Operator.
# Requires the operator to be installed on the cluster first:
#   kubectl apply -f https://github.com/open-telemetry/opentelemetry-operator/releases/latest/download/opentelemetry-operator.yaml
#
# opentelemetry.exporter.endpoint should point to the collector Service:
#   "http://{{ include \"gatewai-gateway.fullname\" . }}-collector:4318"
otlpOperator:
  enabled: false
  mode: deployment    # deployment | daemonset | statefulset | sidecar
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # annotations: {}
  # serviceAccount: ""
  config:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: "0.0.0.0:4318"
    exporters:
      # Replace with your backend — examples:
      # otlp/tempo:
      #   endpoint: "http://tempo:4317"
      # otlphttp/jaeger:
      #   endpoint: "http://jaeger-collector:4318"
      debug: {}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          exporters: [debug]
        logs:
          receivers: [otlp]
          exporters: [debug]


# ── Dashboard UI (optional, disabled by default) ──────────────────────────────
ui:
  enabled: false
  image:
    repository: ghcr.io/qatr-io/gatewai/ui
    tag: ""           # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    host: ui.gatewai.example.com
    tls: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvVars: []
  # Groups or roles that grant admin access (see all consumers' data).
  adminGroups: []
  adminRoles: []

# ── PostgreSQL (optional, required for UI history) ────────────────────────────
postgres:
  # Full PostgreSQL connection string. Supports ${VAR} expansion.
  # Example: "postgres://gatewai:${PG_PASSWORD}@postgres:5432/gatewai?sslmode=require"
  dsn: ""
  maxConns: 10
  connectTimeout: "5s"
  # Name of an existing Secret with key POSTGRES_DSN (overrides dsn above).
  existingSecret: ""
