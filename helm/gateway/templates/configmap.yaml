{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gatewai-gateway.fullname" . }}
  labels:
    {{- include "gatewai-gateway.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      addr: ":8080"
      # write_timeout: 0 — les requêtes sync peuvent durer plusieurs minutes ;
      # le timeout est géré par Knative timeoutSeconds côté InferenceService.
      write_timeout: 0s
      {{- if .Values.server.priorityHeader }}
      priority_header: {{ .Values.server.priorityHeader | quote }}
      {{- end }}
      {{- if .Values.server.consumerHeader }}
      consumer_header: {{ .Values.server.consumerHeader | quote }}
      {{- end }}
      {{- if .Values.server.userTypeHeader }}
      user_type_header: {{ .Values.server.userTypeHeader | quote }}
      {{- end }}

    s3:
      endpoint:   "{{ .Values.s3.endpoint }}"
      region:     "{{ .Values.s3.region }}"
      access_key: "${S3_ACCESS_KEY}"
      secret_key: "${S3_SECRET_KEY}"
      bucket:     "{{ .Values.s3.bucket }}"
      ca_bundle:    "${S3_CA_BUNDLE:-}"
      use_path_style: {{ .Values.s3.usePathStyle | default true }}
      ssl_insecure:   {{ .Values.s3.sslInsecure | default false }}

    encryption:
      key: "${ENCRYPTION_KEY:-}"

    redis:
      addr:         "{{ include "gatewai-gateway.redisAddr" . }}"
      password:     ""
      db:           0

    lifecycle:
      persists_result: {{ .Values.lifecycle.persistsResult | default false }}
      job_ttl:
        global: "{{ .Values.lifecycle.jobTTL.global | default "" }}"
        {{- if .Values.lifecycle.jobTTL.completed }}
        completed: "{{ .Values.lifecycle.jobTTL.completed }}"
        {{- end }}
        {{- if .Values.lifecycle.jobTTL.pending }}
        pending: "{{ .Values.lifecycle.jobTTL.pending }}"
        {{- end }}
        {{- if .Values.lifecycle.jobTTL.failed }}
        failed: "{{ .Values.lifecycle.jobTTL.failed }}"
        {{- end }}
      gc:
        enabled: {{ .Values.lifecycle.gc.enabled | default false }}
        interval: "{{ .Values.lifecycle.gc.interval | default "15m" }}"
        orphan_min_age: "{{ .Values.lifecycle.gc.orphanMinAge | default "5m" }}"

    metrics:
      top_consumers: {{ .Values.metricsConfig.topConsumers | default 0 }}
      consumer_labels: {{ .Values.metricsConfig.consumerLabels | default false }}

    {{- if .Values.rateLimits }}
    rate_limits:
      {{- range $svcType, $userLimits := .Values.rateLimits }}
      {{ $svcType }}:
        {{- range $userType, $cfg := $userLimits }}
        {{ $userType | quote }}:
          {{- if $cfg.rate }}
          rate:   {{ $cfg.rate }}
          period: {{ $cfg.period | quote }}
          {{- end }}
          {{- if $cfg.tokenRate }}
          token_rate:   {{ $cfg.tokenRate }}
          token_period: {{ $cfg.tokenPeriod | quote }}
          {{- end }}
          {{- if $cfg.maxConcurrent }}
          max_concurrent: {{ $cfg.maxConcurrent }}
          {{- end }}
          {{- if $cfg.processingTime }}
          processing_time:   {{ $cfg.processingTime }}
          processing_period: {{ $cfg.processingPeriod | quote }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}

    services:
    {{- range .Values.services }}
      - type:              {{ .type }}
        {{- if .model }}
        model:             {{ .model | quote }}
        {{- end }}
        {{- if .default }}
        default:           true
        {{- end }}
        {{- if .operations }}
        operations:
          {{- range $op, $paths := .operations }}
          {{ $op }}: {{ $paths | toJson }}
          {{- end }}
        {{- end }}
        {{- if .inferenceURL }}
        inference_url:     {{ .inferenceURL | quote }}
        {{- end }}
        {{- if .backends }}
        backends:
          {{- range .backends }}
          - url:    {{ .url | quote }}
            weight: {{ .weight }}
            {{- if .model }}
            model:  {{ .model | quote }}
            {{- end }}
            {{- if .headers }}
            headers:
              {{- range $k, $v := .headers }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- if .provider }}
        provider:          {{ .provider | quote }}
        {{- end }}
        {{- if .backendModel }}
        backend_model:     {{ .backendModel | quote }}
        {{- end }}
        {{- if .responseCacheTTL }}
        response_cache_ttl: {{ .responseCacheTTL }}
        {{- end }}
        {{- if .retries }}
        retries:           {{ .retries }}
        {{- end }}
        {{- if .maxConcurrentSync }}
        max_concurrent_sync: {{ .maxConcurrentSync }}
        {{- end }}
        {{- if .guardrails }}
        guardrails:
          {{- if .guardrails.action }}
          action: {{ .guardrails.action | quote }}
          {{- end }}
          {{- if .guardrails.checks }}
          checks: [{{ range $i, $c := .guardrails.checks }}{{ if $i }}, {{ end }}{{ $c | quote }}{{ end }}]
          {{- end }}
        {{- end }}
        {{- if .inferenceHeaders }}
        inference_headers:
          {{- range $k, $v := .inferenceHeaders }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
        {{- end }}
        {{- if .swaggerURL }}
        swagger_url: {{ .swaggerURL | quote }}
        {{- end }}
        {{- if .swaggerHeaders }}
        swagger_headers:
          {{- range $k, $v := .swaggerHeaders }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
        {{- end }}
        {{- if .tokenLimits }}
        token_limits:
          {{- range $userType, $cfg := .tokenLimits }}
          {{ $userType | quote }}:
            token_rate:   {{ $cfg.tokenRate }}
            token_period: {{ $cfg.tokenPeriod | quote }}
          {{- end }}
        {{- end }}
        accepted_exts:     {{ .acceptedExts | toJson }}
        max_file_size_mb:  {{ .maxFileSizeMB }}
    {{- end }}
{{- end }}
