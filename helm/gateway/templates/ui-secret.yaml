{{- if and .Values.ui.enabled .Values.postgres.dsn (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gatewai-gateway.fullname" . }}-postgres
  labels:
    {{- include "gatewai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ .Values.postgres.dsn | quote }}
{{- end }}
