model: "${RELAY_MODEL}"   # e.g. "whisper-diarization"

redis:
  addr:     "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD:-}"
  db:       0

encryption:
  # Must match the key configured on the gateway.
  key: "${ENCRYPTION_KEY:-}"

s3:
  endpoint:   "${S3_ENDPOINT:-https://s3.fr-par.scw.cloud}"
  region:     "${S3_REGION:-fr-par}"
  access_key: "${S3_ACCESS_KEY}"
  secret_key: "${S3_SECRET_KEY}"
  bucket:     "${S3_BUCKET:-gatewai-jobs}"
  # ca_bundle: path to a PEM file with CA certificates for the S3 endpoint TLS verification.
  # Required when the endpoint uses a private or self-signed CA.
  # Set via S3_CA_BUNDLE (mounted ConfigMap/Secret). Empty = system certificate pool.
  ca_bundle:  "${S3_CA_BUNDLE:-}"

# Inference service endpoint. For Job deployments, set INFERENCE_BASE_URL to the InferenceService cluster URL.
# INFERENCE_PORT is the port of the model server in the pod.
# The OpenAI path (e.g. /v1/audio/transcriptions) is provided per-job by the
# gateway (Job.inference_url) and appended at runtime:
#   final URL = base_url + inference_url
#
# extra_fields: optional form fields added to every multipart request.
# Use them to pass model-specific parameters (empty values are skipped).
inference:
  base_url:             "http://127.0.0.1:${INFERENCE_PORT:-9000}"
  api_key:              ""
  timeout:              "${INFERENCE_TIMEOUT:-300s}"
  ready_timeout:        "${INFERENCE_READY_TIMEOUT:-10m}"
  ready_interval:       "${INFERENCE_READY_INTERVAL:-5s}"
  health_check_timeout: "${INFERENCE_HEALTH_CHECK_TIMEOUT:-2s}"
  extra_fields:
    response_format: "json"
    # language: "fr"
    # prompt: "Extract all text visible in this document."
