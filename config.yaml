server:
  addr: ":8080"
  read_timeout: 120s   # large for file uploads
  # write_timeout: 0 — sync proxy can run for several minutes; timeout is
  # enforced by Knative timeoutSeconds on the InferenceService side.
  write_timeout: 0s
  idle_timeout: 120s
  # priority_header: HTTP header that marks high-priority submissions (e.g. "X-Priority").
  # When set and the header is present in the request, the job is inserted at the
  # HEAD of the relay queue (LPUSH) so the next available relay picks it up first.
  # Leave empty to disable priority routing.
  priority_header: "${PRIORITY_HEADER:-}"
  # consumer_header: HTTP header injected by APISIX after authentication to
  # identify the API consumer (e.g. "X-Consumer-Username").
  # When set:
  #   - consumer name is stored in the job record and indexed in Redis
  #   - GET /jobs returns the consumer's job list
  #   - GET /jobs/{type}/{id} enforces ownership (404 on mismatch)
  #   - gatewai_jobs_by_consumer_total metric is emitted per consumer
  # Leave empty in deployments without upstream authentication.
  consumer_header: "${CONSUMER_HEADER:-}"
  # user_type_header: HTTP header injected by OPA to identify the user type for
  # rate limiting (e.g. "X-User-Type"). Values are matched against rate_limits
  # entries; "*" is the fallback when the header is absent or unlisted.
  # Leave empty to apply only the "*" fallback (no per-type differentiation).
  user_type_header: "${USER_TYPE_HEADER:-}"

# ─────────────────────────────────────────────────────────────────────────────
# Authentication (optional). Absent ⇒ no gateway-side auth: identity is trusted
# from the upstream headers above (the default when the gateway sits behind an
# upstream reverse proxy that authenticates). Pick ONE mode per deployment.
# ─────────────────────────────────────────────────────────────────────────────
# auth:
#   mode: oauth2                  # oauth2 | proxy
#   oauth2:                       # validate OAuth2 access tokens (resource-server model)
#     issuer: "${OAUTH_ISSUER}"   # discovery → jwks_uri + introspection_endpoint
#     jwks_url: ""                # optional explicit override (else discovered from issuer)
#     validation: auto            # auto | jwt | introspection
#                                 #   auto: JWT tokens → local JWKS; opaque tokens → introspection
#     introspection:              # RFC 7662 — validates opaque tokens AND gives live revocation
#       client_id: "${OAUTH_CLIENT_ID}"
#       client_secret: "${OAUTH_CLIENT_SECRET}"
#       cache_ttl: 60s            # cache introspection results (capped by token exp)
#     audiences: ["gatewai"]      # at least one must match the token's aud
#     claims:                     # dotted paths — configure per identity provider
#       consumer: "preferred_username"
#       scopes:   "scope"
#       groups:   "groups"
#       roles:    "roles"
#   proxy:                        # trust identity headers set by an upstream reverse proxy
#     consumer_header: "X-Consumer-Username"
#     user_type_header: "X-Consumer-Type"
#     groups_header:   "X-Consumer-Groups"
#     roles_header:    "X-Consumer-Roles"
# oauth2 fails closed (401 invalid/missing, 503 if the IdP/JWKS is unreachable) and
# strips the client bearer before proxying to backends. /health /metrics /docs
# /openapi.yaml are always exempt. Auth config changes require a gateway restart.

# ─────────────────────────────────────────────────────────────────────────────
# Access control (optional). Requires auth.mode to be set. Default-deny allowlist:
# a request is allowed only if some rule both matches the caller's identity and
# grants the requested model. Absent ⇒ no access control. Hot-reloadable.
# ─────────────────────────────────────────────────────────────────────────────
# policies:
#   default: deny                 # deny (allowlist) | allow (enforcement disabled)
#   rules:
#     - match:                    # each non-empty field must intersect the caller; empty match = everyone
#         groups: ["research-lab"]
#         # roles / scopes / consumers / user_types are also supported
#       allow_models: ["gpt-oss-120b", "chat-*"]   # globs against the model alias
#       allow_service_types: ["llm"]               # optional; globs against service type
#       limits:                     # optional per-group quota (per-member; coexists with rate_limits)
#         rate: 1000                #   request rate
#         period: 1m
#         token_rate: 5000000       #   token budget (LLM)
#         token_period: 1h
#     - match: { roles: ["admin"] }
#       allow_models: ["*"]

# Health check probing (GET /health?verbose=true)
# By default GET /health returns {"status":"ok"} with no backend probing.
# Pass ?verbose=true to probe each backend and get per-model status.
# Pass ?mode=strict to return 500 when any backend is down.
# Pass ?model=<name> to probe a single model.
# ─────────────────────────────────────────────────────────────────────────────
health:
  # How often the background health batch runs. GET /health reads the cached result —
  # no live probing happens on the request path.
  # In multi-instance deployments only one replica probes per cycle (Redis lock).
  interval: "${HEALTH_INTERVAL:-30s}"
  # Default HTTP timeout for each backend probe within a batch.
  # Override per-service via services[].health.timeout for models that scale to 0
  # (Knative cold start can take 30–60 s).
  timeout: "${HEALTH_TIMEOUT:-5s}"

s3:
  # Standard S3-compatible object storage — configured here for Scaleway.
  # Endpoint format (Scaleway): https://s3.<region>.scw.cloud
  # Available regions:          fr-par | nl-ams | pl-waw
  endpoint: "${S3_ENDPOINT:-https://s3.fr-par.scw.cloud}"
  region: "${S3_REGION:-fr-par}"
  access_key: "${S3_ACCESS_KEY}"    # Scaleway API Access Key ID
  secret_key: "${S3_SECRET_KEY}"    # Scaleway API Secret Key
  bucket: "${S3_BUCKET:-gatewai-jobs}"
  # ca_bundle: path to a PEM file with CA certificates for the S3 endpoint TLS verification.
  # Required when the endpoint uses a private or self-signed CA.
  # Set via S3_CA_BUNDLE (injected by Helm when s3.existingCABundle is configured).
  # Empty (default) = system certificate pool.
  ca_bundle: "${S3_CA_BUNDLE:-}"
  # use_path_style: force path-style URLs (https://endpoint/bucket/key).
  # Required for most S3-compatible providers (MinIO, Ceph, etc.). Default: true.
  use_path_style: ${S3_USE_PATH_STYLE:-true}
  # ssl_insecure: disable TLS certificate verification. Use only for development.
  ssl_insecure: ${S3_SSL_INSECURE:-false}

encryption:
  # AES-256-GCM at-rest encryption for S3 objects.
  # Generate with: openssl rand -hex 32
  # Must be identical on all gateway and relay instances.
  # Empty = encryption disabled (default).
  key: "${ENCRYPTION_KEY:-}"

redis:
  addr: "${REDIS_ADDR:-redis:6379}"
  password: "${REDIS_PASSWORD:-}"
  db: 0
  # pending_max_age: mark pending jobs as failed (stale) after this duration with no relay pickup.
  # Empty or "0s" disables stale-pending sweep. Default: 2h.
  # ⚠ Must be shorter than the S3 input staging TTL — the GC deletes input files when marking
  # jobs stale. If the GC runs after S3 has already purged the input, the relay gets "file not found".
  pending_max_age: "${PENDING_MAX_AGE:-2h}"

# ─────────────────────────────────────────────────────────────────────────────
# Lifecycle — job record and S3 result retention
# ─────────────────────────────────────────────────────────────────────────────
lifecycle:
  # persists_result: controls whether S3 results and Redis records are cleaned up
  # on first consumption (GET /jobs/{type}/{id} or webhook delivery).
  # false (default): cleanup is immediate — minimises storage usage.
  # true: records persist until their TTL expires — clients can re-fetch.
  persists_result: ${LIFECYCLE_PERSISTS_RESULT:-false}
  # job_ttl: Redis TTL applied to job records.
  # global is the fallback for all statuses; per-status values take precedence.
  # When all are empty, an internal 2h safety net applies for orphaned records.
  # Example: "24h", "72h"
  job_ttl:
    global: "${LIFECYCLE_JOB_TTL:-}"
    # completed:  "${LIFECYCLE_JOB_TTL_COMPLETED:-}"
    # pending:    "${LIFECYCLE_JOB_TTL_PENDING:-}"
    # failed:     "${LIFECYCLE_JOB_TTL_FAILED:-}"
    # cancelled:  "${LIFECYCLE_JOB_TTL_CANCELLED:-}"
  # gc: unified background garbage collector. Sweeps stale-pending jobs, orphaned
  # S3 objects, and relay queue entries left behind by a crashed relay pod.
  # enabled: false by default — set to true to activate.
  # interval: how often the GC runs (default 15m).
  # orphan_min_age: S3 objects younger than this are never treated as orphans (default 5m).
  gc:
    enabled: ${LIFECYCLE_GC_ENABLED:-false}
    interval: "${LIFECYCLE_GC_INTERVAL:-15m}"
    orphan_min_age: "${LIFECYCLE_GC_ORPHAN_MIN_AGE:-5m}"
    # max_reap_attempts: the reaper requeues jobs abandoned in the processing
    # list by a dead relay pod (expired lease). After this many requeues a job is
    # dead-lettered to relay:{model}:deadletter and marked failed. Default 3.
    max_reap_attempts: ${LIFECYCLE_GC_MAX_REAP_ATTEMPTS:-3}

# ─────────────────────────────────────────────────────────────────────────────
# Webhooks — durable outbound delivery of job-completion callbacks
# One inline attempt is made on completion; failures are persisted to a Redis
# retry queue (survives gateway restarts) and retried with exponential backoff.
# After max_retries attempts a webhook is dead-lettered to the Redis list
# "webhook:deadletter" and counted by gatewai_webhook_deliveries_total{result="deadletter"}.
# ─────────────────────────────────────────────────────────────────────────────
webhooks:
  max_retries: ${WEBHOOK_MAX_RETRIES:-3}      # total attempts (incl. the inline one) before dead-letter
  retry_backoff: "${WEBHOOK_RETRY_BACKOFF:-30s}" # base backoff; doubles each retry
  max_backoff: "${WEBHOOK_MAX_BACKOFF:-10m}"    # backoff cap
  # signing_secret: when set, every webhook carries an HMAC-SHA256 header
  #   X-Gatewai-Signature: t=<unix>,v1=<hex over "<t>.<body>">
  # so consumers can verify authenticity and reject replays (stale t). Empty = unsigned.
  signing_secret: "${WEBHOOK_SIGNING_SECRET:-}"

# ─────────────────────────────────────────────────────────────────────────────
# Async jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # idempotency_ttl: how long an "Idempotency-Key" header → job mapping is kept.
  # A repeat POST /jobs/{type} with the same key (per consumer) returns the
  # original job instead of starting a duplicate inference. Default 24h.
  idempotency_ttl: "${JOBS_IDEMPOTENCY_TTL:-24h}"
  # expired_marker_ttl: how long a lightweight "this job existed" tombstone is
  # kept after submission. While it lives, polling a job whose record TTL has
  # passed returns 410 (status "expired") instead of 404. Should exceed the job
  # record TTL. Default 168h (7 days).
  expired_marker_ttl: "${JOBS_EXPIRED_MARKER_TTL:-168h}"

# ─────────────────────────────────────────────────────────────────────────────
# Metrics — consumer tracking
# Ces options activent un suivi fin de la consommation LLM par consumer.
# Les deux mécanismes sont indépendants et peuvent être activés simultanément.
# ─────────────────────────────────────────────────────────────────────────────
metrics:
  # top_consumers: expose les N meilleurs consommateurs LLM dans Prometheus via
  # gatewai_llm_consumer_tokens_top{consumer, user_type, type="prompt|completion"}.
  # Stocké dans un sorted set Redis (ZINCRBY), rafraîchi toutes les 60s.
  # Nécessite que server.consumer_header soit configuré.
  # 0 = désactivé (défaut).
  top_consumers: ${METRICS_TOP_CONSUMERS:-0}
  # consumer_labels: émet des labels Prometheus directs par consumer
  # (gatewai_llm_tokens_total{consumer=...}).
  # Réservé aux déploiements avec un nombre borné de consumers (< 50).
  # Pour des deployments avec des consumers dynamiques, préférer top_consumers.
  # false = désactivé (défaut).
  consumer_labels: false

# ─────────────────────────────────────────────────────────────────────────────
# Service registry
# To add a new inference service: append a block below. No code change needed.
#
# Sync mode (OpenAI-compatible endpoints):
#   model:         value of the "model" field in the OpenAI payload
#   operations:    map of operation name → list of URL paths
#                  all paths are indexed for sync routing; the first is used for async
#   inference_url: base URL of the backend — original request path is appended at runtime
#
# Async mode (Redis queue):
#   accepted_exts / max_file_size_mb
#   operation:     (form field) optional operation name for async submission
#                  required when the model has multiple operations
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: audio
    # Sync / OpenAI-compatible
    model: "whisper-large-v3"
    default: true  # used when no model is specified and multiple models are configured
    operations:
      transcription:
        - "/v1/audio/transcriptions"
      translation:
        - "/v1/audio/translations"
    inference_url: "${TRANSCRIPTION_WHISPER_LARGE_V3_URL:-http://gatewai-transcription-predictor.default.svc.cluster.local}"
    accepted_exts: [".mp3", ".wav", ".m4a", ".ogg", ".flac"]
    max_file_size_mb: 500
    # health: backend probing config for GET /health?verbose=true.
    # Uncomment and tune for models that scale to 0 (Knative cold start can
    # take 30-60 s; the global 5 s default will mark them as "down").
    # health:
    #   timeout: "60s"   # wait up to 60 s for cold-start
    #   path: "/health"  # default; override if the backend uses a different path
    #   disabled: false  # set true to skip this model in health probes

  # ── Example: add a second model variant for the same service type ──────────
  # - type: audio
  #   model: "whisper-large-v3-turbo"
  #   ...
  # Both models share the same rate_limits["audio"] counter per consumer.

  - type: ocr
    # Sync / OpenAI-compatible
    model: "llava-v1.6-mistral-7b"
    operations:
      ocr:
        - "/v1/ocr"
        - "/v1/vision/ocr"
    inference_url: "${OCR_LLAVA_URL:-http://gatewai-ocr-predictor.default.svc.cluster.local}"
    accepted_exts: [".pdf", ".jpg", ".jpeg", ".png", ".tiff", ".bmp"]
    max_file_size_mb: 50

  # ── Example: add a second model variant for the same service type ──────────
  # - type: audio
  #   model: "whisper-large-v3-turbo"
  #   operations:
  #     transcription:
  #       - "/v1/audio/transcriptions"
  #     translation:
  #       - "/v1/audio/translations"
  #   inference_url: "http://gatewai-transcription-turbo-predictor.default.svc.cluster.local"
  #   accepted_exts: [".mp3", ".wav", ".m4a", ".ogg", ".flac"]
  #   max_file_size_mb: 500

  # ── Example: LLM proxy services (provider + optional response cache) ────────
  #
  # OpenAI passthrough — proxy to api.openai.com, cache responses for 1 hour.
  # - type: llm
  #   model: "gpt-4o"
  #   default: true
  #   provider: openai
  #   response_cache_ttl: 3600        # seconds; 0 = disabled
  #   operations:
  #     chat:
  #       - "/v1/chat/completions"
  #   inference_url: ""               # empty = defaults to https://api.openai.com
  #   inference_headers:
  #     Authorization: "Bearer ${OPENAI_API_KEY}"
  #   guardrails:                     # detect PII / secrets in LLM requests (sync /v1/* path)
  #     # action: block (reject 422) | redact (mask matches in-place, forward cleaned body) | flag (log only)
  #     action: redact
  #     # check groups (all opt-in): pii (universal: email, credit card, IBAN, IPv4, phone E.164),
  #     #               pii_fr (phone FR, NIR, SIREN/SIRET), pii_us (SSN), pii_uk (NINO),
  #     #               pii_es (DNI), pii_it (Codice Fiscale), secrets (API keys, tokens, private keys)
  #     checks: [pii, secrets]
  #     # Optional output stage — scan/redact the model RESPONSE (output DLP).
  #     # Streaming responses always degrade to flag (cannot redact/block mid-stream).
  #     output:
  #       checks: [pii, secrets]
  #       action: redact
  #
  # Anthropic — translate OpenAI-format requests to the Messages API automatically.
  # - type: llm
  #   model: "claude-3-5-sonnet-20241022"
  #   provider: anthropic
  #   response_cache_ttl: 3600
  #   operations:
  #     chat:
  #       - "/v1/chat/completions"
  #   inference_url: ""               # empty = defaults to https://api.anthropic.com
  #   inference_headers:
  #     x-api-key: "${ANTHROPIC_API_KEY}"
  #
  # Ollama — OpenAI-compatible local model, no translation needed.
  # - type: llm
  #   model: "llama3.2"
  #   provider: ollama
  #   response_cache_ttl: 0           # disable caching for local models
  #   operations:
  #     chat:
  #       - "/v1/chat/completions"
  #   inference_url: "http://ollama.default.svc.cluster.local:11434"
  #
  # Passthrough — forward verbatim with server-side headers injected.
  # - type: llm
  #   model: "mixtral-8x7b"
  #   provider: passthrough
  #   response_cache_ttl: 1800
  #   operations:
  #     chat:
  #       - "/v1/chat/completions"
  #   inference_url: "http://vllm.default.svc.cluster.local:8000"
  #   inference_headers:
  #     Authorization: "Bearer ${VLLM_TOKEN}"
  #
  # ── Multi-backend : blue/green, canary, fallback ──────────────────────────
  # Replace inference_url with a backends list. Mutually exclusive: backends
  # takes precedence when both are set.
  #
  # weight > 0 — eligible for primary selection (weighted random).
  # weight = 0 — fallback-only: tried only if all weight>0 backends fail.
  #
  # Blue/green  — weight: 100/0 ; flip to 0/100 to cut over.
  # Canary      — weight: 90/10 ; ramp up the new backend gradually.
  # Fallback    — weight: 100 primary + weight: 0 last-resort.
  #
  # - type: llm
  #   model: "gpt-4o"
  #   provider: openai
  #   operations:
  #     chat:
  #       - "/v1/chat/completions"
  #   # Canary: 90 % on stable, 10 % on canary endpoint.
  #   backends:
  #     - url: "http://vllm-stable.default.svc.cluster.local:8000"
  #       weight: 90
  #       model: "llama-3.1-8b"            # optional: real model name sent to this backend (overrides backend_model)
  #       headers:                          # optional: per-backend headers (override inference_headers)
  #         Authorization: "Bearer ${STABLE_API_KEY}"
  #     - url: "http://vllm-canary.default.svc.cluster.local:8000"
  #       weight: 10
  #       model: "llama-3.2-8b"            # canary: different model version
  #       headers:
  #         Authorization: "Bearer ${CANARY_API_KEY}"
  #     - url: "http://vllm-fallback.default.svc.cluster.local:8000"
  #       weight: 0    # only used if both stable and canary return 5xx
  #
  # ── Model aliasing + visibility : beta-testing through the same API ───────────
  # backend_model rewrites the model name before forwarding, so clients keep using
  # a stable public alias while you swap the real model behind it. It is surfaced
  # (as `backend_model`) in GET /v1/models so developers can see what runs behind
  # each alias.
  #
  # visibility gates a model to specific audiences. A restricted model is filtered
  # out of GET /v1/models — and returns 404 on /v1/* and /jobs — for callers outside
  # its audience, so a hidden model is indistinguishable from a non-existent one.
  # This lets you beta-test a new model through the same API before general release.
  #   user_types — matched against server.user_type_header (e.g. sa, user, beta)
  #   groups     — matched against the authenticated Principal's groups (auth required)
  # Public (no visibility block) = visible to everyone. Composes with `policies`
  # access control: a caller must pass BOTH visibility and any authz allow-rule.
  #
  # - type: llm
  #   model: "next-gen"                 # stable public alias
  #   provider: passthrough
  #   backend_model: "llama-3.3-70b"    # real model surfaced in GET /v1/models
  #   operations:
  #     chat:
  #       - "/v1/chat/completions"
  #   inference_url: "http://vllm.default.svc.cluster.local:8000"
  #   visibility:                       # omit this block to make the model public
  #     user_types: ["beta"]            # only callers with X-User-Type: beta see/use it
  #     groups: ["ai-team"]             # OR members of the ai-team group

# ─────────────────────────────────────────────────────────────────────────────
# Rate limiting
# Per-consumer, per-service-type limits keyed by user type (server.user_type_header).
# Applies to both async (POST /jobs/{type}) and sync (POST /v1/*) endpoints.
# "*" is the fallback when the header is absent or the type has no specific entry.
# Multiple models for the same service type share the same counter.
# Leave this section empty (or omit it) to disable rate limiting.
#
# Each entry may configure request-count limits, token-budget limits, or both:
#   rate / period              — max requests per time window (e.g. rate: 100, period: 1m)
#   token_rate / token_period  — max total tokens (prompt+completion) per window
#                                (only meaningful for LLM proxy services with a provider)
#                                token_rate: 0 (or absent) disables token budget enforcement.
#   max_concurrent             — max async jobs in pending+processing state at any moment.
#                                Applies to async job submissions only. 0 = unlimited.
#   processing_time / processing_period
#                              — max cumulative inference seconds (from result.json
#                                processing_time) per window. Applies to both async jobs
#                                and sync proxy calls. 0 = unlimited.
# ─────────────────────────────────────────────────────────────────────────────
# rate_limits:
#   audio:
#     premium:
#       rate: 100
#       period: 1m
#       max_concurrent: 10          # at most 10 jobs in flight simultaneously
#       processing_time: 7200       # at most 2 h of inference per hour
#       processing_period: 1h
#     standard:
#       rate: 20
#       period: 1m
#       max_concurrent: 3
#       processing_time: 600
#       processing_period: 1h
#     "*":
#       rate: 10
#       period: 1m
#       max_concurrent: 1
#       processing_time: 120
#       processing_period: 1h
#   ocr:
#     "*":
#       rate: 5
#       period: 1m
#   llm:
#     sa:                         # service accounts: high request rate, large token budget
#       rate: 1000
#       period: 1m
#       token_rate: 5000000       # 5 M tokens / hour
#       token_period: 1h
#     "*":                        # regular users: stricter limits
#       rate: 60
#       period: 1m
#       token_rate: 100000        # 100 k tokens / hour
#       token_period: 1h

# ─────────────────────────────────────────────────────────────────────────────
# OpenTelemetry (optional)
# ─────────────────────────────────────────────────────────────────────────────
# opentelemetry:
#   enabled: false
#
#   # Base exporter — applies to all signals unless overridden per-signal.
#   exporter:
#     endpoint: "http://otel-collector:4318"   # OTLP/HTTP
#     insecure: false
#     # headers:
#     #   Authorization: "Bearer ${OTEL_TOKEN}"
#
#   traces:
#     enabled: true
#     sample_ratio: 1.0   # 1.0 = always sample, 0.1 = 10 %
#     # ignore_paths: path prefixes excluded from tracing (prefix-based).
#     # Defaults: ["/health", "/metrics", "/docs", "/openapi.yaml"]
#     # ignore_paths:
#     #   - /health
#     #   - /metrics
#     #   - /docs
#     #   - /openapi.yaml
#     # langfuse.enabled: attach prompt/completion content and gen_ai.usage.*
#     # to LLM request spans (for a Langfuse-consuming pipeline downstream).
#     # Independent of traces.enabled so you can send generic traces without
#     # also forwarding prompt content to Langfuse.
#     langfuse:
#       enabled: false
#
#   # OTLP metrics push (useful for short-lived processes or when Prometheus
#   # scrape is not available, e.g. relay running as a Kubernetes Job).
#   metrics:
#     enabled: false
#     interval: "60s"
#
#   # Forward structured logs (slog) via OTLP.
#   logs:
#     enabled: false
